<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title></title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --text: #18202b;
        --muted: #5b6575;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11151b;
          --text: #e8ecf1;
          --muted: #9aa5b4;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 "Segoe UI",
          Tahoma,
          sans-serif;
        text-align: center;
      }
      p {
        margin: 4px 0;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Shown while the server is starting or unreachable; the app retries by itself. Both languages at once. -->
    <div>
      <p>Waiting for the server…</p>
      <p dir="rtl" lang="ar">بانتظار الخادم…</p>
      <p class="muted">This window connects by itself as soon as the server answers.</p>
      <p class="muted" dir="rtl" lang="ar">ستتصل هذه النافذة تلقائياً عندما يستجيب الخادم.</p>
    </div>
  </body>
</html>
